<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SlideAgent Speech to Text</title>
  </head>
  <body>
    <script>
      /* Hidden helper: K-PrimeApp SpeechToText.js recognition loop.
         UI lives in the SlideAgent window. */
      const params = new URLSearchParams(location.search);
      const token = params.get("token") || "";
      const session = params.get("session") || "0";
      const qs = `?token=${encodeURIComponent(token)}&session=${encodeURIComponent(session)}`;
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      let language = params.get("lang") || "tr-TR";
      let recognition = null;
      let stopped = false;

      function post(path, body) {
        return fetch(path + qs, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body || {}),
          keepalive: true,
        }).catch(() => {});
      }

      function startListening() {
        if (!SpeechRecognition) {
          post("/transcript", { text: "", live: false, session: Number(session) });
          return;
        }
        if (recognition) {
          try { recognition.stop(); } catch (e) { /* ignore */ }
        }
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = language;

        recognition.onresult = (event) => {
          let finalText = "";
          let interimText = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) finalText += transcript + " ";
            else interimText += transcript;
          }
          if (interimText) {
            post("/transcript", { text: interimText.trim(), live: true, session: Number(session) });
          }
          if (finalText.trim()) {
            post("/transcript", { text: finalText.trim(), live: false, session: Number(session) });
          }
        };

        recognition.onerror = (event) => {
          if (event.error === "no-speech" || event.error === "aborted") return;
          if (event.error === "not-allowed" || event.error === "service-not-allowed") {
            stopped = true;
          }
        };

        recognition.onend = () => {
          if (stopped) return;
          try { recognition.start(); } catch (e) { /* already running */ }
        };

        try {
          recognition.start();
          stopped = false;
        } catch (e) {
          /* autoplay / gesture */
        }
      }

      function stopListening() {
        stopped = true;
        if (recognition) {
          try { recognition.onend = null; } catch (e) { /* ignore */ }
          try { recognition.abort(); } catch (e) { /* ignore */ }
          try { recognition.stop(); } catch (e) { /* ignore */ }
        }
        recognition = null;
      }

      async function poll() {
        try {
          const res = await fetch("/state" + qs, { cache: "no-store" });
          const data = await res.json();
          if (data.language && data.language !== language) {
            language = data.language;
            if (!stopped) startListening();
          }
          if (!data.listening || String(data.session) !== String(session)) {
            stopListening();
            post("/closed", { session: Number(session) });
            window.close();
            return;
          }
        } catch (e) {
          /* main process closed */
        }
        setTimeout(poll, 400);
      }

      window.addEventListener("pagehide", () => {
        stopListening();
        post("/closed", { session: Number(session) });
      });

      startListening();
      poll();
    </script>
  </body>
</html>
