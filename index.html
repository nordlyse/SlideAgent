<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SlideAgent</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="setup" hidden>
      <div class="brand">
        <img src="./assets/icon.png" alt="" width="36" height="36" />
        <div>
          <h1>SlideAgent</h1>
          <p class="tag">Choose your language · Sprache wählen · Dil seçin · 言語を選択</p>
        </div>
      </div>
      <div id="setupLangs"></div>
    </div>

    <div id="app">
      <header>
        <div class="brand">
          <img src="./assets/icon.png" alt="" width="36" height="36" />
          <div>
            <h1>SlideAgent</h1>
            <p class="tag" data-i18n="tag">Voice control for PowerPoint / Impress</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="helpOpen" type="button" class="ghost" data-i18n="help">Help</button>
          <label class="switch">
            <input id="listen" type="checkbox" />
            <span data-i18n="listen">Listen</span>
          </label>
        </div>
      </header>

      <section class="panel status-panel">
        <p id="status" data-kind="idle">Starting…</p>
        <dl>
          <div><dt data-i18n="microphone">Microphone</dt><dd><span class="meter" aria-hidden="true"><span id="meterBar"></span></span> <span id="meterLabel">off</span></dd></div>
          <div><dt data-i18n="heard">Heard</dt><dd id="heard">—</dd></div>
          <div><dt data-i18n="command">Command</dt><dd id="action">—</dd></div>
          <div><dt data-i18n="engine">Engine</dt><dd id="backend">—</dd></div>
        </dl>
      </section>

      <section class="panel">
        <label>
          <span data-i18n="language">Language</span>
          <select id="language"></select>
        </label>
        <label>
          <span data-i18n="presentationEngine">Presentation engine</span>
          <select id="engine">
            <option value="auto" data-i18n="engineAuto">Auto</option>
            <option value="powerpoint" data-i18n="enginePowerpoint">PowerPoint API</option>
            <option value="impress" data-i18n="engineImpress">LibreOffice UNO</option>
            <option value="keyboard" data-i18n="engineKeyboard">Keyboard</option>
          </select>
        </label>
        <label>
          <span data-i18n="speechRecognition">Speech recognition</span>
          <select id="stt">
            <option value="chrome" data-i18n="sttChrome">Speech to Text</option>
            <option value="vosk" data-i18n="sttVosk">Vosk (offline fallback)</option>
          </select>
        </label>
        <p id="micHint" class="hint"></p>
      </section>

      <section class="panel">
        <label class="grow">
          <span data-i18n="typeCommand">Type a command</span>
          <span class="row">
            <input id="manual" type="text" placeholder="next, back, first, go to slide 15" />
            <button id="send" type="button" data-i18n="send">Send</button>
          </span>
        </label>
      </section>

      <section class="panel">
        <h2 data-i18n="recent">Recent commands</h2>
        <ul id="log"></ul>
      </section>

      <footer>
        <p id="examples"></p>
      </footer>
    </div>

    <div id="help" hidden>
      <div class="help-card">
        <div class="help-top">
          <h2 data-i18n="helpTitle">Supported words</h2>
          <button id="helpClose" type="button" class="ghost" data-i18n="helpClose">Close</button>
        </div>
        <p id="helpIntro" class="hint" data-i18n="helpIntro">Say or type these commands:</p>
        <dl id="helpList"></dl>
        <p id="helpGotoNote" class="hint" data-i18n="helpGotoNote">For a specific slide, say a number such as 15.</p>
      </div>
    </div>
    <script type="module" src="/src/renderer.js"></script>
  </body>
</html>
